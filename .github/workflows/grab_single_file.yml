name: MPG Dataset Single File Download

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'MPG Username (email)'
        required: true
        type: string
        default: 'jamshid.bahrami@alumni.um.ac.ir'
      password:
        description: 'MPG Password'
        required: true
        type: string
      base_login_url:
        description: 'Base login URL (e.g., https://amass.is.tue.mpg.de or https://smpl.is.tue.mpg.de)'
        required: true
        type: string
        default: 'https://amass.is.tue.mpg.de'
      download_url:
        description: 'Full download URL (e.g., https://download.is.tue.mpg.de/download.php?domain=amass&sfile=...)'
        required: true
        type: string
      output_filename:
        description: 'Output filename (optional, will auto-detect if empty)'
        required: false
        type: string
        default: ''
      allow_html:
        description: 'Allow downloading HTML pages (true/false)'
        required: false
        type: boolean
        default: false
      push_to_repo:
        description: 'Push file to repository?'
        required: false
        type: boolean
        default: true
      split_size:
        description: 'Split size for large files (e.g., 95m, 50m) - empty to disable splitting'
        required: false
        type: string
        default: '95m'

jobs:
  download-single-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Login and download file
        id: download
        env:
          USERNAME: ${{ github.event.inputs.username }}
          PASSWORD: ${{ github.event.inputs.password }}
          BASE_LOGIN_URL: ${{ github.event.inputs.base_login_url }}
          DOWNLOAD_URL: ${{ github.event.inputs.download_url }}
          OUTPUT_NAME: ${{ github.event.inputs.output_filename }}
          ALLOW_HTML: ${{ github.event.inputs.allow_html }}
          SPLIT_SIZE: ${{ github.event.inputs.split_size }}
        shell: bash
        run: |
          # Remove trailing slash if present
          BASE_LOGIN_URL=$(echo "$BASE_LOGIN_URL" | sed 's:/*$::')
          
          echo "Base Login URL: $BASE_LOGIN_URL"
          echo "Download URL: $DOWNLOAD_URL"
          echo "Allow HTML: $ALLOW_HTML"
          echo "Split size: $SPLIT_SIZE"
          
          # Create download directory
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DOWNLOAD_DIR="mpg_download_${TIMESTAMP}"
          mkdir -p "$DOWNLOAD_DIR"
          cd "$DOWNLOAD_DIR"
          
          # Save directory name for later steps
          echo "DOWNLOAD_DIR=$DOWNLOAD_DIR" >> $GITHUB_ENV
          echo "DOWNLOAD_PATH=$(pwd)" >> $GITHUB_ENV
          
          # Construct login URL
          LOGIN_URL="${BASE_LOGIN_URL}/login.php"
          
          echo "Logging in to ${LOGIN_URL}..."
          
          # Login and save session
          curl -L -c cookies.txt -b cookies.txt \
            -d "username=$USERNAME" \
            -d "password=$PASSWORD" \
            -d "commit=Log in" \
            "$LOGIN_URL" -o login_response.html
          
          # Verify login
          if grep -q -i "logout\|dashboard\|account\|welcome" login_response.html; then
            echo "✓ Login successful"
          else
            echo "✗ Login failed"
            head -20 login_response.html
            exit 1
          fi
          
          # Download the requested file
          echo "Downloading from: $DOWNLOAD_URL"
          
          # Determine output filename
          if [ -z "$OUTPUT_NAME" ]; then
            if [[ "$DOWNLOAD_URL" == *"sfile="* ]]; then
              OUTPUT_NAME=$(echo "$DOWNLOAD_URL" | grep -oP 'sfile=\K[^&]+' | sed 's/%2F/\//g' | xargs basename)
            fi
            
            if [ -z "$OUTPUT_NAME" ]; then
              OUTPUT_NAME=$(basename "$DOWNLOAD_URL" | sed 's/?.*//')
            fi
            
            if [ -z "$OUTPUT_NAME" ] || [ "$OUTPUT_NAME" = "download.php" ] || [ "$OUTPUT_NAME" = "download" ]; then
              OUTPUT_NAME="downloaded_file"
            fi
          fi
          
          echo "Output file: $OUTPUT_NAME"
          echo "DOWNLOAD_FILE=$OUTPUT_NAME" >> $GITHUB_ENV
          
          # Download with session cookies
          HTTP_CODE=$(curl -L -b cookies.txt -c cookies.txt \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            -H "Referer: ${BASE_LOGIN_URL}/" \
            -o "$OUTPUT_NAME" \
            -w "%{http_code}" \
            "$DOWNLOAD_URL")
          
          echo "HTTP Status: $HTTP_CODE"
          
          # Check if download was successful
          if [ ! -f "$OUTPUT_NAME" ] || [ ! -s "$OUTPUT_NAME" ]; then
            echo "✗ Download failed"
            exit 1
          fi
          
          size=$(du -h "$OUTPUT_NAME" | cut -f1)
          size_bytes=$(stat -c%s "$OUTPUT_NAME")
          echo "✓ Successfully downloaded: $OUTPUT_NAME"
          echo "  Size: $size ($size_bytes bytes)"
          
          # Split file if it's large
          if [ -n "$SPLIT_SIZE" ] && [ "$size_bytes" -gt 104857600 ]; then
            echo ""
            echo "⚠ File exceeds GitHub's 100MB limit ($size)"
            echo "Splitting into ${SPLIT_SIZE} chunks..."
            
            # Split the file
            split -b "$SPLIT_SIZE" -d "$OUTPUT_NAME" "${OUTPUT_NAME}.part"
            
            # Create reassembly script
            reassemble_script="reassemble_${OUTPUT_NAME}.sh"
            echo '#!/bin/bash' > "$reassemble_script"
            echo '# Reassemble the split file' >> "$reassemble_script"
            echo "cat ${OUTPUT_NAME}.part* > ${OUTPUT_NAME}" >> "$reassemble_script"
            echo 'echo "✓ Reassembled ${0%.sh}"' >> "$reassemble_script"
            echo 'echo "Verify with: md5sum -c ${0%.sh}.md5"' >> "$reassemble_script"
            chmod +x "$reassemble_script"
            
            # Calculate MD5 of original
            md5sum "$OUTPUT_NAME" > "${OUTPUT_NAME}.md5"
            
            # Remove original large file
            rm "$OUTPUT_NAME"
            
            # List split parts
            echo ""
            echo "Created split parts:"
            ls -lh "${OUTPUT_NAME}.part"*
            
            # Count parts
            part_count=$(ls "${OUTPUT_NAME}.part"* 2>/dev/null | wc -l)
            echo "Total parts: $part_count"
            echo "SPLIT_PARTS=$part_count" >> $GITHUB_ENV
            
            # Store part list for pushing
            echo "PART_LIST=$(ls ${OUTPUT_NAME}.part* | tr '\n' ' ')" >> $GITHUB_ENV
            
            # Update manifest
            split_info="**Split into ${part_count} parts (${SPLIT_SIZE} each)**\n\n"
            split_info="${split_info}To reassemble:\n"
            split_info="${split_info}\`\`\`bash\n"
            split_info="${split_info}bash reassemble_${OUTPUT_NAME}.sh\n"
            split_info="${split_info}md5sum -c ${OUTPUT_NAME}.md5\n"
            split_info="${split_info}\`\`\`\n"
          else
            split_info=""
          fi
          
          # Create manifest
          {
            printf "# MPG Dataset Download\n\n"
            printf "**Date:** %s\n\n" "$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            printf "**Base Login URL:** %s\n\n" "$BASE_LOGIN_URL"
            printf "**Download URL:** %s\n\n" "$DOWNLOAD_URL"
            printf "**HTTP Status:** %s\n\n" "$HTTP_CODE"
            printf "**Original Size:** %s (%s bytes)\n\n" "$size" "$size_bytes"
            
            printf "## Downloaded files:\n\n"
            
            if [ -n "$SPLIT_SIZE" ] && [ "$size_bytes" -gt 104857600 ]; then
              printf "**File was split due to GitHub size limit (100MB)**\n\n"
              printf "### Split parts:\n"
              for part in ${OUTPUT_NAME}.part*; do
                part_size=$(du -h "$part" | cut -f1)
                printf -- "- \`%s\` (%s)\n" "$part" "$part_size"
              done
              printf "\n%s" "$split_info"
            else
              printf -- "- **%s** (%s)\n" "$OUTPUT_NAME" "$size"
            fi
            
            printf "\n## Usage:\n\n"
            printf '```bash\n'
            printf "# Extract the dataset\n"
            if [ -n "$SPLIT_SIZE" ] && [ "$size_bytes" -gt 104857600 ]; then
              printf "# First reassemble the file:\n"
              printf "bash reassemble_%s.sh\n\n" "$OUTPUT_NAME"
              printf "# Then extract:\n"
              printf "tar -xjf %s\n" "$OUTPUT_NAME"
            else
              printf "tar -xjf %s\n" "$OUTPUT_NAME"
            fi
            printf '```\n'
          } > MANIFEST.md
          
          # Cleanup
          rm -f cookies.txt login_response.html
          
          echo ""
          echo "Download directory contents:"
          ls -la
          
          cd ..
          echo "✓ Download process completed successfully"
          
      - name: Push manifest and helper files
        if: github.event.inputs.push_to_repo == 'true' && success()
        shell: bash
        run: |
          echo "=== Pushing Manifest and Helper Files ==="
          
          # Find the download directory
          DOWNLOAD_DIR="${{ env.DOWNLOAD_DIR }}"
          if [ -z "$DOWNLOAD_DIR" ] || [ ! -d "$DOWNLOAD_DIR" ]; then
            DOWNLOAD_DIR=$(ls -td mpg_download_* 2>/dev/null | head -1)
            if [ -z "$DOWNLOAD_DIR" ]; then
              echo "No download directory found!"
              exit 1
            fi
          fi
          
          echo "Download directory: $DOWNLOAD_DIR"
          
          # Get the current branch
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Current branch: $BRANCH"
          
          # Configure git for large files
          git config http.postBuffer 524288000
          
          # Set remote URL with token
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          
          # Push manifest
          if [ -f "$DOWNLOAD_DIR/MANIFEST.md" ]; then
            echo "Pushing MANIFEST.md..."
            git add "$DOWNLOAD_DIR/MANIFEST.md"
            git commit -m "Add MANIFEST.md for MPG dataset [skip ci]"
            git push "$REMOTE_URL" "HEAD:$BRANCH"
          fi
          
          # Push reassembly script if it exists
          if ls "$DOWNLOAD_DIR"/reassemble_*.sh 1> /dev/null 2>&1; then
            echo "Pushing reassembly script..."
            git add "$DOWNLOAD_DIR"/reassemble_*.sh
            git commit -m "Add reassembly script for MPG dataset [skip ci]"
            git push "$REMOTE_URL" "HEAD:$BRANCH"
          fi
          
          # Push MD5 file if it exists
          if [ -f "$DOWNLOAD_DIR/${{ env.DOWNLOAD_FILE }}.md5" ]; then
            echo "Pushing MD5 checksum..."
            git add "$DOWNLOAD_DIR/${{ env.DOWNLOAD_FILE }}.md5"
            git commit -m "Add MD5 checksum for MPG dataset [skip ci]"
            git push "$REMOTE_URL" "HEAD:$BRANCH"
          fi
          
      - name: Push split parts one by one
        if: github.event.inputs.push_to_repo == 'true' && success() && env.PART_LIST != ''
        shell: bash
        run: |
          echo "=== Pushing Split Parts One by One ==="
          
          # Find the download directory
          DOWNLOAD_DIR="${{ env.DOWNLOAD_DIR }}"
          if [ -z "$DOWNLOAD_DIR" ] || [ ! -d "$DOWNLOAD_DIR" ]; then
            DOWNLOAD_DIR=$(ls -td mpg_download_* 2>/dev/null | head -1)
            if [ -z "$DOWNLOAD_DIR" ]; then
              echo "No download directory found!"
              exit 1
            fi
          fi
          
          echo "Download directory: $DOWNLOAD_DIR"
          
          # Get the current branch
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Current branch: $BRANCH"
          
          # Set remote URL with token
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          
          # Get list of split parts
          cd "$DOWNLOAD_DIR"
          PART_FILES=$(ls ${{ env.DOWNLOAD_FILE }}.part* 2>/dev/null || true)
          
          if [ -z "$PART_FILES" ]; then
            echo "No split parts found to push"
            exit 0
          fi
          
          echo "Found split parts:"
          echo "$PART_FILES"
          
          # Push each part individually
          PART_NUMBER=1
          TOTAL_PARTS=$(echo "$PART_FILES" | wc -l)
          
          for PART in $PART_FILES; do
            echo ""
            echo "----------------------------------------"
            echo "Pushing part $PART_NUMBER of $TOTAL_PARTS: $PART"
            echo "----------------------------------------"
            
            # Add and commit this single part
            git add "$PART"
            git commit -m "Add $PART (part $PART_NUMBER/$TOTAL_PARTS) of ${{ env.DOWNLOAD_FILE }} [skip ci]"
            
            # Push this part
            if git push "$REMOTE_URL" "HEAD:$BRANCH"; then
              echo "✓ Successfully pushed $PART"
            else
              echo "✗ Failed to push $PART"
              echo "Retrying with pull first..."
              git pull "$REMOTE_URL" "$BRANCH" --rebase
              if git push "$REMOTE_URL" "HEAD:$BRANCH"; then
                echo "✓ Successfully pushed $PART after rebase"
              else
                echo "✗ Still failed to push $PART"
                exit 1
              fi
            fi
            
            PART_NUMBER=$((PART_NUMBER + 1))
          done
          
          echo ""
          echo "========================================"
          echo "✓ All $TOTAL_PARTS parts pushed successfully!"
          echo "========================================"
          
      - name: Push single file (if not split)
        if: github.event.inputs.push_to_repo == 'true' && success() && env.PART_LIST == ''
        shell: bash
        run: |
          echo "=== Pushing Single File ==="
          
          # Find the download directory
          DOWNLOAD_DIR="${{ env.DOWNLOAD_DIR }}"
          if [ -z "$DOWNLOAD_DIR" ] || [ ! -d "$DOWNLOAD_DIR" ]; then
            DOWNLOAD_DIR=$(ls -td mpg_download_* 2>/dev/null | head -1)
            if [ -z "$DOWNLOAD_DIR" ]; then
              echo "No download directory found!"
              exit 1
            fi
          fi
          
          echo "Download directory: $DOWNLOAD_DIR"
          
          # Get the current branch
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Current branch: $BRANCH"
          
          # Configure git for large files
          git config http.postBuffer 524288000
          
          # Set remote URL with token
          REMOTE_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          
          # Add and push the downloaded file
          if [ -f "$DOWNLOAD_DIR/${{ env.DOWNLOAD_FILE }}" ]; then
            echo "Adding ${{ env.DOWNLOAD_FILE }}..."
            git add "$DOWNLOAD_DIR/${{ env.DOWNLOAD_FILE }}"
            
            # Check if file is too large for GitHub
            FILE_SIZE=$(stat -c%s "$DOWNLOAD_DIR/${{ env.DOWNLOAD_FILE }}" 2>/dev/null || stat -f%z "$DOWNLOAD_DIR/${{ env.DOWNLOAD_FILE }}" 2>/dev/null)
            if [ "$FILE_SIZE" -gt 104857600 ]; then
              echo "⚠ Warning: File is larger than 100MB ($(numfmt --to=iec $FILE_SIZE))"
              echo "This may fail to push. Consider using split_size in future downloads."
            fi
            
            git commit -m "Add MPG dataset: ${{ env.DOWNLOAD_FILE }} [skip ci]"
            
            if git push "$REMOTE_URL" "HEAD:$BRANCH"; then
              echo "✓ Successfully pushed ${{ env.DOWNLOAD_FILE }}"
            else
              echo "✗ Failed to push file (may exceed GitHub size limit)"
              exit 1
            fi
          else
            echo "No file to push"
          fi
