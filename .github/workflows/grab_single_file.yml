name: MPG Dataset Single File Download

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'MPG Username (email)'
        required: true
        type: string
        default: 'jamshid.bahrami@alumni.um.ac.ir'
      password:
        description: 'MPG Password'
        required: true
        type: string
      base_login_url:
        description: 'Base login URL (e.g., https://amass.is.tue.mpg.de or https://smpl.is.tue.mpg.de)'
        required: true
        type: string
        default: 'https://amass.is.tue.mpg.de'
      download_url:
        description: 'Full download URL (e.g., https://download.is.tue.mpg.de/download.php?domain=amass&sfile=...)'
        required: true
        type: string
      output_filename:
        description: 'Output filename (optional, will auto-detect if empty)'
        required: false
        type: string
        default: ''
      allow_html:
        description: 'Allow downloading HTML pages (true/false)'
        required: false
        type: boolean
        default: false
      push_to_repo:
        description: 'Push file to repository?'
        required: false
        type: boolean
        default: true

jobs:
  download-single-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
      - name: Login and download file
        id: download
        env:
          USERNAME: ${{ github.event.inputs.username }}
          PASSWORD: ${{ github.event.inputs.password }}
          BASE_LOGIN_URL: ${{ github.event.inputs.base_login_url }}
          DOWNLOAD_URL: ${{ github.event.inputs.download_url }}
          OUTPUT_NAME: ${{ github.event.inputs.output_filename }}
          ALLOW_HTML: ${{ github.event.inputs.allow_html }}
        shell: bash
        run: |
          # Remove trailing slash if present
          BASE_LOGIN_URL=$(echo "$BASE_LOGIN_URL" | sed 's:/*$::')
          
          echo "Base Login URL: $BASE_LOGIN_URL"
          echo "Download URL: $DOWNLOAD_URL"
          echo "Allow HTML: $ALLOW_HTML"
          
          # Create download directory
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          DOWNLOAD_DIR="mpg_download_${TIMESTAMP}"
          mkdir -p "$DOWNLOAD_DIR"
          cd "$DOWNLOAD_DIR"
          
          # Save directory name for later steps
          echo "DOWNLOAD_DIR=$DOWNLOAD_DIR" >> $GITHUB_ENV
          echo "DOWNLOAD_PATH=$(pwd)" >> $GITHUB_ENV
          
          # Construct login URL
          LOGIN_URL="${BASE_LOGIN_URL}/login.php"
          
          echo "Logging in to ${LOGIN_URL}..."
          
          # Login and save session
          curl -L -c cookies.txt -b cookies.txt \
            -d "username=$USERNAME" \
            -d "password=$PASSWORD" \
            -d "commit=Log in" \
            "$LOGIN_URL" -o login_response.html
          
          # Verify login (look for common success indicators)
          if grep -q -i "logout\|dashboard\|account\|welcome" login_response.html; then
            echo "✓ Login successful"
          else
            echo "✗ Login failed"
            echo "Response preview:"
            head -20 login_response.html
            exit 1
          fi
          
          # Download the requested file/page
          echo "Downloading from: $DOWNLOAD_URL"
          
          # Determine output filename
          if [ -z "$OUTPUT_NAME" ]; then
            # Try to extract from sfile parameter if present
            if [[ "$DOWNLOAD_URL" == *"sfile="* ]]; then
              OUTPUT_NAME=$(echo "$DOWNLOAD_URL" | grep -oP 'sfile=\K[^&]+' | sed 's/%2F/\//g' | xargs basename)
            fi
            
            # If still empty, try basename of URL
            if [ -z "$OUTPUT_NAME" ]; then
              OUTPUT_NAME=$(basename "$DOWNLOAD_URL" | sed 's/?.*//')
            fi
            
            # Final fallback
            if [ -z "$OUTPUT_NAME" ] || [ "$OUTPUT_NAME" = "download.php" ] || [ "$OUTPUT_NAME" = "download" ]; then
              OUTPUT_NAME="downloaded_file"
            fi
          fi
          
          echo "Output file: $OUTPUT_NAME"
          echo "DOWNLOAD_FILE=$OUTPUT_NAME" >> $GITHUB_ENV
          
          # Download with session cookies and follow redirects
          HTTP_CODE=$(curl -L -b cookies.txt -c cookies.txt \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            -H "Referer: ${BASE_LOGIN_URL}/" \
            -o "$OUTPUT_NAME" \
            -w "%{http_code}" \
            "$DOWNLOAD_URL")
          
          echo "HTTP Status: $HTTP_CODE"
          
          # Check if download was successful
          if [ -f "$OUTPUT_NAME" ] && [ -s "$OUTPUT_NAME" ]; then
            size=$(du -h "$OUTPUT_NAME" | cut -f1)
            lines=$(wc -l < "$OUTPUT_NAME")
            file_type=$(file "$OUTPUT_NAME")
            file_type_clean=$(file "$OUTPUT_NAME" | cut -d: -f2- | sed 's/^[[:space:]]*//')
            
            echo "✓ Successfully downloaded: $OUTPUT_NAME"
            echo "  Size: $size"
            echo "  Lines: $lines"
            echo "  Type: $file_type"
            
            # Check if it's HTML and we didn't allow it
            if echo "$file_type" | grep -q "HTML document"; then
              if [ "$ALLOW_HTML" = "false" ]; then
                echo "⚠ Warning: Downloaded HTML page instead of binary file"
                echo "  This usually means:"
                echo "    1. Login failed (check credentials)"
                echo "    2. Wrong base login URL (tried: $BASE_LOGIN_URL)"
                echo "    3. File requires additional permissions"
                echo ""
                echo "  If you intentionally want HTML pages, set 'allow_html' to true"
              else
                echo "✓ HTML page download allowed"
              fi
              
              # Show preview
              echo ""
              echo "Page preview (first 10 lines):"
              echo "----------------------------------------"
              head -10 "$OUTPUT_NAME"
              echo "----------------------------------------"
            fi
            
            # Create manifest using printf with proper escaping
            {
              printf "# MPG Dataset Download\n\n"
              printf "**Date:** %s\n\n" "$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
              printf "**Base Login URL:** %s\n\n" "$BASE_LOGIN_URL"
              printf "**Download URL:** %s\n\n" "$DOWNLOAD_URL"
              printf "**HTTP Status:** %s\n\n" "$HTTP_CODE"
              printf "**Allow HTML:** %s\n\n" "$ALLOW_HTML"
              
              printf "## Downloaded files:\n\n"
              printf -- "- **%s**\n" "$OUTPUT_NAME"
              printf "  - Size: %s\n" "$size"
              printf "  - Lines: %s\n" "$lines"
              printf -- "  - Type: %s\n\n" "$file_type_clean"
              
              printf "## Usage:\n\n"
              printf '```bash\n'
              printf "# Check file type\n"
              printf "file %s\n\n" "$OUTPUT_NAME"
              printf "# If it's a tar.bz2 file:\n"
              printf "tar -xjf %s\n\n" "$OUTPUT_NAME"
              printf "# If it's a tar.gz file:\n"
              printf "tar -xzf %s\n\n" "$OUTPUT_NAME"
              printf "# If it's a zip file:\n"
              printf "unzip %s\n\n" "$OUTPUT_NAME"
              printf "# If it's an HTML page (for inspection):\n"
              printf "cat %s\n" "$OUTPUT_NAME"
              printf '```\n'
            } > MANIFEST.md
            
            # If HTML, extract links for convenience
            if echo "$file_type" | grep -q "HTML document"; then
              {
                printf "\n## Download links found in page:\n\n"
                grep -E 'href="[^"]*\.(zip|tar|gz|tgz|bz2|xz|7z)[^"]*"' "$OUTPUT_NAME" | \
                  sed 's/.*href="//; s/".*//' | \
                  while IFS= read -r link; do
                    printf -- "- \`%s\`\n" "$link"
                  done
              } >> MANIFEST.md
              
              # If no links found, add a note
              if ! grep -q "Download links found" MANIFEST.md; then
                printf "\n- No direct download links found\n" >> MANIFEST.md
              fi
            fi
            
            echo "✓ Manifest created successfully"
            
          else
            echo "✗ Download failed - file is empty or missing"
            echo "HTTP Status: $HTTP_CODE"
            exit 1
          fi
          
          # Cleanup sensitive files
          rm -f cookies.txt login_response.html
          
          # List final contents
          echo ""
          echo "Download directory contents:"
          ls -la
          
          cd ..
          
          echo "✓ Download process completed successfully"
          
      - name: List files before push
        shell: bash
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo ""
          echo "Download directory: ${{ env.DOWNLOAD_DIR }}"
          if [ -n "${{ env.DOWNLOAD_DIR }}" ] && [ -d "${{ env.DOWNLOAD_DIR }}" ]; then
            echo "Contents of ${{ env.DOWNLOAD_DIR }}:"
            ls -la "${{ env.DOWNLOAD_DIR }}"
          else
            echo "Download directory not found!"
          fi
          
      - name: Push file to repository
        if: github.event.inputs.push_to_repo == 'true' && success()
        shell: bash
        run: |
          # Debug information
          echo "=== Debug Info ==="
          echo "Current branch: ${GITHUB_REF#refs/heads/}"
          echo "Current directory: $(pwd)"
          echo "Files in current directory:"
          ls -la
          echo ""
          
          # Find the download directory (should be in env.DOWNLOAD_DIR)
          if [ -n "${{ env.DOWNLOAD_DIR }}" ] && [ -d "${{ env.DOWNLOAD_DIR }}" ]; then
            DOWNLOAD_DIR="${{ env.DOWNLOAD_DIR }}"
            echo "Found download directory from env: $DOWNLOAD_DIR"
          else
            # Fallback: find the most recent mpg_download_* directory
            DOWNLOAD_DIR=$(ls -td mpg_download_* 2>/dev/null | head -1)
            if [ -z "$DOWNLOAD_DIR" ]; then
              echo "❌ No download directory found!"
              echo "Available directories:"
              ls -la
              exit 1
            fi
            echo "Found download directory from ls: $DOWNLOAD_DIR"
          fi
          
          echo "Download directory: $DOWNLOAD_DIR"
          echo "Contents:"
          ls -la "$DOWNLOAD_DIR"
          echo ""
          
          # Get the current branch
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Current branch: $BRANCH"
          
          # Check if we have changes to commit
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          
          # Show what will be committed
          echo "Changes to commit:"
          git status --short
          echo ""
          
          # Add the download directory
          git add "$DOWNLOAD_DIR"
          
          # Also add if there's a specific file we should track
          if [ -n "${{ env.DOWNLOAD_FILE }}" ] && [ -f "$DOWNLOAD_DIR/${{ env.DOWNLOAD_FILE }}" ]; then
            echo "Specifically adding: $DOWNLOAD_DIR/${{ env.DOWNLOAD_FILE }}"
            git add "$DOWNLOAD_DIR/${{ env.DOWNLOAD_FILE }}"
          fi
          
          # Commit the changes
          git commit -m "Add MPG dataset: ${{ env.DOWNLOAD_FILE }} from ${{ github.event.inputs.base_login_url }} [skip ci]"
          
          # Push to the repository
          echo "Pushing to origin/$BRANCH..."
          git push origin "HEAD:$BRANCH"
          
          if [ $? -eq 0 ]; then
            echo "✅ Files pushed successfully!"
            echo "Download directory: $DOWNLOAD_DIR"
            echo "File: ${{ env.DOWNLOAD_FILE }}"
          else
            echo "❌ Failed to push to repository"
            exit 1
          fi
          
      - name: Summary of download
        if: success()
        shell: bash
        run: |
          echo "## Download Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Directory:** \`${{ env.DOWNLOAD_DIR }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** \`${{ env.DOWNLOAD_FILE }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Base URL:** ${{ github.event.inputs.base_login_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pushed to repo:** ${{ github.event.inputs.push_to_repo }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ env.DOWNLOAD_DIR }}" ] && [ -f "${{ env.DOWNLOAD_DIR }}/MANIFEST.md" ]; then
            echo "### Manifest Content" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            head -30 "${{ env.DOWNLOAD_DIR }}/MANIFEST.md" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
